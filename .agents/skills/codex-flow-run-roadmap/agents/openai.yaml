interface:
  display_name: "Codex Flow: Wykonaj roadmapę"
  short_description: "Cała roadmapa w jednym wątku bez subagentów"
  default_prompt: "Użyj $codex-flow-run-roadmap: wykonaj wszystkie otwarte milestone'y, następnie zweryfikuj integrację całego wyniku i napraw błędy mieszczące się w zakresie. Wszystkie etapy wykonuj samodzielnie w tym wątku. Nie wywołuj żadnych subagentów ani nie wykonuj stagingu, commitów lub pusha."
